name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Literal Unicode punctuation in these sources has been silently
      # re-encoded before (en/em dashes in the reference regexes became U+FFFD),
      # which broke every verse range without failing the build. Sources stay
      # ASCII-only; escapes such as "\xE2\x80\x93" express non-ASCII bytes.
      - name: Check sources are ASCII-only
        shell: pwsh
        run: |
          $offenders = @()
          Get-ChildItem -Path VerseLinkWindows, tests -Include *.cpp, *.h -Recurse |
            Where-Object { $_.Name -notlike 'tinyxml2.*' } |
            ForEach-Object {
                $bytes = [System.IO.File]::ReadAllBytes($_.FullName)
                for ($i = 0; $i -lt $bytes.Length; $i++) {
                    if ($bytes[$i] -gt 127) {
                        $offenders += ('{0}: first non-ASCII byte 0x{1:X2} at offset {2}' -f $_.FullName, $bytes[$i], $i)
                        break
                    }
                }
            }
          if ($offenders.Count -gt 0) {
            Write-Host "Non-ASCII bytes found in source files:"
            $offenders | ForEach-Object { Write-Host "  $_" }
            exit 1
          }
          Write-Host "All sources are ASCII-only."

      # The MSVC environment is set up inline rather than through
      # ilammy/msvc-dev-cmd. That action has no Node 24 release, so it would keep
      # tripping the Node 20 deprecation no matter how it is pinned; doing it here
      # also drops a third-party dependency from the build. vswhere locates the
      # toolchain the same way the MSBuild step below does.
      - name: Build and run test harness
        shell: cmd
        run: |
          set "VSWHERE=%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe"
          for /f "usebackq tokens=*" %%i in (`"%VSWHERE%" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSROOT=%%i"
          if not defined VSROOT (
            echo Could not locate a Visual Studio installation with the C++ toolset
            exit /b 1
          )
          call "%VSROOT%\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b 1
          cl /nologo /EHsc /O2 /std:c++20 /utf-8 /W3 /IVerseLinkWindows tests\test_harness.cpp VerseLinkWindows\Bible.cpp VerseLinkWindows\ConfigManager.cpp VerseLinkWindows\Logger.cpp VerseLinkWindows\StringExtensions.cpp VerseLinkWindows\TaskQueue.cpp VerseLinkWindows\VerseFormatter.cpp VerseLinkWindows\tinyxml2.cpp VerseLinkWindows\VerseRetrieveInterface.cpp /Fe:tests\test_harness.exe
          if errorlevel 1 exit /b 1
          tests\test_harness.exe
          if errorlevel 1 exit /b 1

      - name: Build application (Release x64)
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsRoot = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -property installationPath
          & "$vsRoot\MSBuild\Current\Bin\MSBuild.exe" "VerseLinkWindows\VerseLinkWindows.vcxproj" /p:Configuration=Release /p:Platform=x64 /m /v:m /nologo
          exit $LASTEXITCODE

      # Exercises the shipped binary's real lookup and formatting path - the same
      # code VerseLinkTask runs - across every formatting setting, with no GUI.
      - name: Run headless self test
        shell: cmd
        run: |
          VerseLinkWindows\x64\Release\VerseLinkWindows.exe --selftest
          if errorlevel 1 exit /b 1

      - name: Upload built exe
        uses: actions/upload-artifact@v7
        with:
          name: VerseLinkWindows-x64
          path: VerseLinkWindows/x64/Release/VerseLinkWindows.exe
          if-no-files-found: error
